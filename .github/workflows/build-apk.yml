name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build AnanviAI APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Official Gradle Wrapper Jar
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 8.10.2

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnanviAI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "AnanviAI v1.2.0 (Debug APK)"
          body: |
            ### AnanviAI v1.2.0 Debug Build
            CI-built debug APK for testing. This is not a Play Store-signed production release.
            - Preserves existing Hugging Face, OpenRouter, Groq, Together AI, Ollama, OpenAI, Anthropic and Gemini provider IDs/keys
            - Adds direct Gemini, NVIDIA NIM, Cloudflare Workers AI, SambaNova and Cohere trial integrations
            - Adds a free-first model catalogue with free-tier/trial labels and quota notes
            - Migrates existing API keys into encrypted Android Keystore-backed preferences and excludes credential files from backups
            - Command Center: JARVIS-X and Hermes endpoint checks, social connector setup, GitHub project shortcuts\n            - Command Center integration architecture and security documentation\n            - Side-by-Side Model Comparison
            - AI Tools & Image Generation
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
